name: Track Upstream Mylar3 Releases

on:
  schedule:
    # Run daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # Get full history for branch operations

      - name: Get latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fetch latest release from mylar3/mylar3 with authentication
          LATEST_RELEASE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/mylar3/mylar3/releases/latest)

          # Validate API response
          if [ -z "$LATEST_RELEASE" ] || [ "$(echo "$LATEST_RELEASE" | jq -r '.message // empty')" = "Not Found" ]; then
            echo "Error: Failed to fetch latest release from upstream"
            exit 1
          fi

          LATEST_VERSION=$(echo "$LATEST_RELEASE" | jq -r '.tag_name')
          RELEASE_URL=$(echo "$LATEST_RELEASE" | jq -r '.html_url')
          RELEASE_BODY=$(echo "$LATEST_RELEASE" | jq -r '.body')
          RELEASE_NAME=$(echo "$LATEST_RELEASE" | jq -r '.name')
          PUBLISHED_AT=$(echo "$LATEST_RELEASE" | jq -r '.published_at')
          IS_PRERELEASE=$(echo "$LATEST_RELEASE" | jq -r '.prerelease')

          # Validate extracted data
          if [ -z "$LATEST_VERSION" ] || [ "$LATEST_VERSION" = "null" ]; then
            echo "Error: Could not extract version from release data"
            exit 1
          fi

          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "release_url=$RELEASE_URL" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "published_at=$PUBLISHED_AT" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

          # Save release body to file for PR description
          echo "$RELEASE_BODY" > /tmp/release_notes.md

          echo "Latest upstream version: $LATEST_VERSION"

      - name: Get current snap version
        id: current
        run: |
          # Extract current version from snapcraft.yaml (more robust parsing)
          CURRENT_VERSION=$(grep '^version:' snap/snapcraft.yaml | awk '{print $2}' | tr -d "'\"")

          # Validate extracted version
          if [ -z "$CURRENT_VERSION" ]; then
            echo "Error: Could not extract version from snapcraft.yaml"
            exit 1
          fi

          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current snap version: $CURRENT_VERSION"

      - name: Check if update is needed
        id: check
        run: |
          LATEST="${{ steps.upstream.outputs.latest_version }}"
          CURRENT="${{ steps.current.outputs.current_version }}"

          # Remove 'v' prefix for comparison
          LATEST_CLEAN=$(echo "$LATEST" | sed 's/^v//')
          CURRENT_CLEAN=$(echo "$CURRENT" | sed 's/^v//')

          echo "Comparing versions: $CURRENT_CLEAN -> $LATEST_CLEAN"

          if [ "$LATEST_CLEAN" != "$CURRENT_CLEAN" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "Update needed!"
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "Already up to date"
          fi

      - name: Checkout beta branch
        if: steps.check.outputs.needs_update == 'true'
        run: |
          # Fetch beta branch with retry logic
          for i in 1 2 3 4; do
            if git fetch origin beta; then
              break
            else
              if [ $i -lt 4 ]; then
                echo "Fetch failed, retrying in $((2**i)) seconds..."
                sleep $((2**i))
              else
                echo "Error: Failed to fetch beta branch after 4 attempts"
                exit 1
              fi
            fi
          done

          git checkout beta
          git pull origin beta

      - name: Update snapcraft.yaml
        if: steps.check.outputs.needs_update == 'true'
        run: |
          LATEST="${{ steps.upstream.outputs.latest_version }}"
          LATEST_CLEAN=$(echo "$LATEST" | sed 's/^v//')

          echo "Updating snapcraft.yaml to version $LATEST_CLEAN (tag: $LATEST)"

          # Backup original file
          cp snap/snapcraft.yaml snap/snapcraft.yaml.bak

          # Update version field
          sed -i "s/^version: '.*'/version: '$LATEST_CLEAN'/" snap/snapcraft.yaml

          # Update source-tag (change from source-branch to source-tag if needed)
          # First check if source-branch exists and replace it
          if grep -q "source-branch:" snap/snapcraft.yaml; then
            sed -i "/source-branch:/d" snap/snapcraft.yaml
            # Add source-tag after source-type line
            sed -i "/source-type: git/a\    source-tag: $LATEST" snap/snapcraft.yaml
          else
            # Just update existing source-tag
            sed -i "s/source-tag: .*/source-tag: $LATEST/" snap/snapcraft.yaml
          fi

          # Validate changes were made
          NEW_VERSION=$(grep '^version:' snap/snapcraft.yaml | awk '{print $2}' | tr -d "'\"")
          NEW_TAG=$(grep 'source-tag:' snap/snapcraft.yaml | awk '{print $2}')

          if [ "$NEW_VERSION" != "$LATEST_CLEAN" ]; then
            echo "Error: Version update failed. Expected $LATEST_CLEAN, got $NEW_VERSION"
            mv snap/snapcraft.yaml.bak snap/snapcraft.yaml
            exit 1
          fi

          if [ "$NEW_TAG" != "$LATEST" ]; then
            echo "Error: Tag update failed. Expected $LATEST, got $NEW_TAG"
            mv snap/snapcraft.yaml.bak snap/snapcraft.yaml
            exit 1
          fi

          # Remove backup if successful
          rm snap/snapcraft.yaml.bak

          echo "Successfully updated snapcraft.yaml to version $LATEST_CLEAN (tag: $LATEST)"

      - name: Commit and push to beta
        if: steps.check.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          LATEST="${{ steps.upstream.outputs.latest_version }}"
          git add snap/snapcraft.yaml

          # Check if there are changes to commit
          if ! git diff --staged --quiet; then
            git commit -m "Update to Mylar3 $LATEST"

            # Push with retry logic
            for i in 1 2 3 4; do
              if git push -u origin beta; then
                echo "Successfully pushed to beta branch"
                break
              else
                if [ $i -lt 4 ]; then
                  echo "Push failed, retrying in $((2**i)) seconds..."
                  sleep $((2**i))
                else
                  echo "Error: Failed to push to beta branch after 4 attempts"
                  exit 1
                fi
              fi
            done
          else
            echo "No changes to commit"
          fi

      - name: Create Pull Request
        if: steps.check.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST="${{ steps.upstream.outputs.latest_version }}"
          LATEST_CLEAN=$(echo "$LATEST" | sed 's/^v//')
          RELEASE_URL="${{ steps.upstream.outputs.release_url }}"
          RELEASE_NAME="${{ steps.upstream.outputs.release_name }}"
          PUBLISHED_AT="${{ steps.upstream.outputs.published_at }}"
          IS_PRERELEASE="${{ steps.upstream.outputs.is_prerelease }}"

          # Format published date
          PUBLISHED_DATE=$(date -d "$PUBLISHED_AT" "+%B %d, %Y" 2>/dev/null || echo "$PUBLISHED_AT")

          # Build PR body
          cat > /tmp/pr_body.md <<EOF
          ## Mylar3 $LATEST Release

          **Upstream release:** $RELEASE_URL
          **Published:** $PUBLISHED_DATE
          $(if [ "$IS_PRERELEASE" = "true" ]; then echo "**⚠️ Pre-release version**"; fi)

          ### Upstream Release Notes

          EOF

          # Append upstream release notes
          cat /tmp/release_notes.md >> /tmp/pr_body.md

          # Add testing checklist
          cat >> /tmp/pr_body.md <<EOF

          ---

          ### Testing Checklist

          After Snapcraft builds to \`beta\` channel (\`snap refresh geebeevv-mylar3 --beta\`):

          - [ ] Snap installs successfully on amd64
          - [ ] Snap installs successfully on arm64 (if applicable)
          - [ ] Service starts without errors
          - [ ] Web UI is accessible at http://localhost:8090
          - [ ] Can log in / basic functionality works
          - [ ] No obvious regressions
          - [ ] Check logs for errors: \`snap logs geebeevv-mylar3\`
          - [ ] Comic library access works (with removable-media connected)

          ### Approval Process

          Once testing is complete, merge this PR to promote to \`stable\` channel.

          **Fast-track:** If this is a security release, skip beta testing period and merge immediately.
          EOF

          # Create PR (will only create if one doesn't already exist)
          gh pr create \
            --base main \
            --head beta \
            --title "Update to Mylar3 $LATEST" \
            --body-file /tmp/pr_body.md \
            --label "upstream-update" \
            || echo "PR may already exist"
