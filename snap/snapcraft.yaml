name: geebeevv-mylar3
base: core24
version: '0.8.3'
title: geebeevv-mylar3
summary: Unofficial Release of Mylar3
description: |
  Mylar3 is an automated Comic Book (cbr/cbz) downloader for use with NZB and torrents. It monitors your pull-lists and automatically manages downloads.

  ## Features
  - NZB and torrent support with multiple clients (SABnzbd, NZBGet, qBittorrent, etc.)
  - Pull-list monitoring and automated downloads
  - Comic library management

  ## Access
  Web interface: http://localhost:8090

  ## Important Notes
  Runs as root, so it can only read files owned by root. You may need to adjust file permissions for your download and library directories.

  ## Setup
  sudo snap connect geebeevv-mylar3:removable-media
  sudo snap connect geebeevv-mylar3:mount-observe

grade: stable
confinement: strict
compression: lzo

platforms:
  amd64:
  arm64:

apps:
  mylar3:
    command: bin/mylar3-launcher
    daemon: simple
    restart-condition: always
    install-mode: enable
    # Allow 20 seconds for graceful shutdown (flush database, close connections)
    stop-timeout: 20s
    # Restart daemon on snap refresh for clean state (prevents old code + new files issues)
    refresh-mode: restart
    plugs:
      - network
      - network-bind
      - removable-media  # For access to download directories and comic libraries
      - mount-observe # For access to mount table
    environment:
      PYTHONPATH: $SNAP/opt/mylar3:$SNAP/usr/lib/python3/dist-packages
      # Mylar3 configuration paths
      MYLAR_DATA_DIR: $SNAP_COMMON/data

  # CLI Commands for easy management
  logs:
    command: bin/mylar3-logs
    plugs:
      - network
      - network-bind

  status:
    command: bin/mylar3-status
    plugs:
      - network
      - network-bind

  config-dir:
    command: bin/mylar3-config-dir

  health-check:
    command: bin/mylar3-health-check
    plugs:
      - network
      - network-bind

  backup:
    command: bin/mylar3-backup

  restore:
    command: bin/mylar3-restore

hooks:
  install:
    plugs:
      - network
      - network-bind

  configure:
    plugs:
      - network
      - network-bind

parts:
  mylar3:
    plugin: python
    source: https://github.com/mylar3/mylar3.git
    source-type: git
    source-tag: v0.8.3

    # Python plugin will automatically handle requirements.txt
    python-packages:
      - APScheduler>=3.6.3
      - beautifulsoup4>=4.8.2
      - cfscrape>=2.0.8
      - cheroot>=8.2.1
      - CherryPy>=18.5.0
      - configparser>=4.0.2
      - feedparser>=5.2.1
      - Mako>=1.1.0
      - natsort>=3.5.2
      - packaging>=22.0
      - Pillow>=10.1
      - portend>=2.6
      - pycryptodome>=3.19.0
      - pystun>=0.1.0
      - pytz>=2019.3
      - rarfile>=4.0
      - requests[socks]>=2.22.0
      - simplejson>=3.17.0
      - six>=1.13.0
      - tenacity>=8.2.3
      - tzlocal>=2.0.0
      - urllib3<2
      - user_agent2>=2021.12.11

    build-packages:
      - git
      - python3-dev
      - build-essential
      - libjpeg-dev
      - zlib1g-dev
      - libfreetype6-dev
      - liblcms2-dev
      - libwebp-dev
      - tcl-dev
      - tk-dev
      - python3-tk

    stage-packages:
      - python3
      - ca-certificates
      - unrar
      - libjpeg-turbo8
      - libfreetype6
      - liblcms2-2
      - libwebp7

    override-build: |
      # Install Python dependencies
      craftctl default

      # Copy all Mylar3 source files to install location
      mkdir -p $CRAFT_PART_INSTALL/opt/mylar3
      cp -r $CRAFT_PART_SRC/* $CRAFT_PART_INSTALL/opt/mylar3/

      # Create launcher script
      mkdir -p $CRAFT_PART_INSTALL/bin
      cat > $CRAFT_PART_INSTALL/bin/mylar3-launcher << 'EOF'
      #!/bin/bash

      # Set up Mylar3 directories using snap-native locations
      # $SNAP_DATA = /var/snap/mylar3/current/ (version-specific)
      # $SNAP_COMMON = /var/snap/mylar3/common/ (shared across versions - preferred)

      # Create necessary directories if they don't exist
      mkdir -p "$SNAP_COMMON/data"
      mkdir -p "$SNAP_COMMON/logs"
      mkdir -p "$SNAP_COMMON/cache"
      mkdir -p "$SNAP_COMMON/comics"

      # Set data directory
      export MYLAR_DATA_DIR="$SNAP_COMMON/data"

      # Read configuration from snapctl
      PORT=$(snapctl get port 2>/dev/null || echo "8090")
      VERBOSE=$(snapctl get verbose 2>/dev/null || echo "false")
      AUTO_BACKUP=$(snapctl get auto-backup 2>/dev/null || echo "none")
      DISABLE_WEEKLY=$(snapctl get disable-weekly-check 2>/dev/null || echo "false")

      # Build command-line arguments
      MYLAR_ARGS="--datadir $SNAP_COMMON/data --config $SNAP_COMMON/data/config.ini --nolaunch --port $PORT"

      # Add verbose flag if enabled
      if [ "$VERBOSE" = "true" ]; then
        MYLAR_ARGS="$MYLAR_ARGS --verbose"
      fi

      # Add backup option if configured
      if [ "$AUTO_BACKUP" != "none" ]; then
        MYLAR_ARGS="$MYLAR_ARGS --backup $AUTO_BACKUP"
      fi

      # Add noweekly flag if disabled
      if [ "$DISABLE_WEEKLY" = "true" ]; then
        MYLAR_ARGS="$MYLAR_ARGS --noweekly"
      fi

      # Run Mylar3 with configured flags
      cd $SNAP/opt/mylar3
      exec python3 Mylar.py $MYLAR_ARGS
      EOF
      chmod +x $CRAFT_PART_INSTALL/bin/mylar3-launcher

      # Create CLI command: logs
      cat > $CRAFT_PART_INSTALL/bin/mylar3-logs << 'EOF'
      #!/bin/bash
      # Show Mylar3 logs with follow option
      if [ "$1" = "-f" ] || [ "$1" = "--follow" ]; then
        exec journalctl -u snap.geebeevv-mylar3.mylar3 -f
      else
        exec journalctl -u snap.geebeevv-mylar3.mylar3 -n 100 --no-pager
      fi
      EOF
      chmod +x $CRAFT_PART_INSTALL/bin/mylar3-logs

      # Create CLI command: status
      cat > $CRAFT_PART_INSTALL/bin/mylar3-status << 'EOF'
      #!/bin/bash
      echo "=== Mylar3 Service Status ==="
      echo ""

      # Check if service is running
      if snapctl services geebeevv-mylar3.mylar3 | grep -q "active"; then
        echo "Service: Running ✓"
      else
        echo "Service: Stopped ✗"
      fi

      # Get configuration
      PORT=$(snapctl get port 2>/dev/null || echo "8090")
      VERBOSE=$(snapctl get verbose 2>/dev/null || echo "false")
      AUTO_BACKUP=$(snapctl get auto-backup 2>/dev/null || echo "none")
      DISABLE_WEEKLY=$(snapctl get disable-weekly-check 2>/dev/null || echo "false")

      echo ""
      echo "=== Configuration ==="
      echo "Port: $PORT"
      echo "Verbose logging: $VERBOSE"
      echo "Auto-backup: $AUTO_BACKUP"
      echo "Disable weekly check: $DISABLE_WEEKLY"

      echo ""
      echo "=== Access ==="
      echo "Web interface: http://localhost:$PORT"

      echo ""
      echo "=== Data Locations ==="
      echo "Config & Database: $SNAP_COMMON/data"
      echo "Logs: $SNAP_COMMON/logs"
      echo "Cache: $SNAP_COMMON/cache"

      echo ""
      echo "=== Interface Connections ==="
      if snap connections geebeevv-mylar3 | grep -q "removable-media.*connected"; then
        echo "removable-media: Connected ✓"
      else
        echo "removable-media: Not connected (run: sudo snap connect geebeevv-mylar3:removable-media)"
      fi

      if snap connections geebeevv-mylar3 | grep -q "mount-observe.*connected"; then
        echo "mount-observe: Connected ✓"
      else
        echo "mount-observe: Not connected (run: sudo snap connect geebeevv-mylar3:mount-observe)"
      fi
      EOF
      chmod +x $CRAFT_PART_INSTALL/bin/mylar3-status

      # Create CLI command: config-dir
      cat > $CRAFT_PART_INSTALL/bin/mylar3-config-dir << 'EOF'
      #!/bin/bash
      echo "$SNAP_COMMON/data"
      EOF
      chmod +x $CRAFT_PART_INSTALL/bin/mylar3-config-dir

      # Create CLI command: health-check
      cat > $CRAFT_PART_INSTALL/bin/mylar3-health-check << 'EOF'
      #!/bin/bash
      echo "=== Mylar3 Health Check ==="
      echo ""

      # Check if service is active
      if snapctl services geebeevv-mylar3.mylar3 | grep -q "active"; then
        echo "✓ Service is running"
      else
        echo "✗ Service is not running"
        exit 1
      fi

      # Check if web interface is responding
      PORT=$(snapctl get port 2>/dev/null || echo "8090")
      if curl -s -o /dev/null -w "%{http_code}" http://localhost:$PORT --max-time 5 | grep -q "200\|302"; then
        echo "✓ Web interface responding on port $PORT"
      else
        echo "✗ Web interface not responding on port $PORT"
        exit 1
      fi

      # Check if data directory exists and is writable
      if [ -d "$SNAP_COMMON/data" ] && [ -w "$SNAP_COMMON/data" ]; then
        echo "✓ Data directory accessible"
      else
        echo "✗ Data directory not accessible"
        exit 1
      fi

      # Check if database exists
      if [ -f "$SNAP_COMMON/data/mylar.db" ]; then
        echo "✓ Database file exists"
      else
        echo "⚠ Database file not found (may be first run)"
      fi

      echo ""
      echo "All checks passed! Mylar3 is healthy."
      EOF
      chmod +x $CRAFT_PART_INSTALL/bin/mylar3-health-check

      # Create CLI command: backup
      cat > $CRAFT_PART_INSTALL/bin/mylar3-backup << 'EOF'
      #!/bin/bash
      BACKUP_DIR="$SNAP_COMMON/backups"
      TIMESTAMP=$(date +%Y%m%d_%H%M%S)

      echo "=== Mylar3 Backup ==="
      echo ""

      mkdir -p "$BACKUP_DIR"

      # Backup config and database
      if [ -f "$SNAP_COMMON/data/config.ini" ]; then
        cp "$SNAP_COMMON/data/config.ini" "$BACKUP_DIR/config.ini.$TIMESTAMP"
        echo "✓ Backed up config.ini"
      fi

      if [ -f "$SNAP_COMMON/data/mylar.db" ]; then
        cp "$SNAP_COMMON/data/mylar.db" "$BACKUP_DIR/mylar.db.$TIMESTAMP"
        echo "✓ Backed up mylar.db"
      fi

      echo ""
      echo "Backup saved to: $BACKUP_DIR"
      echo "Timestamp: $TIMESTAMP"

      # Clean up old backups (keep last 5)
      cd "$BACKUP_DIR"
      ls -t config.ini.* 2>/dev/null | tail -n +6 | xargs rm -f 2>/dev/null
      ls -t mylar.db.* 2>/dev/null | tail -n +6 | xargs rm -f 2>/dev/null
      EOF
      chmod +x $CRAFT_PART_INSTALL/bin/mylar3-backup

      # Create CLI command: restore
      cat > $CRAFT_PART_INSTALL/bin/mylar3-restore << 'EOF'
      #!/bin/bash
      BACKUP_DIR="$SNAP_COMMON/backups"

      echo "=== Mylar3 Restore ==="
      echo ""

      if [ ! -d "$BACKUP_DIR" ]; then
        echo "No backups found in $BACKUP_DIR"
        exit 1
      fi

      # List available backups
      echo "Available backups:"
      echo ""
      ls -lt "$BACKUP_DIR" | grep -v '^d' | grep -v '^total'
      echo ""

      if [ -z "$1" ]; then
        echo "Usage: geebeevv-mylar3.restore <timestamp>"
        echo "Example: geebeevv-mylar3.restore 20250119_120000"
        exit 1
      fi

      TIMESTAMP="$1"

      # Stop service before restore
      echo "Stopping Mylar3 service..."
      snapctl stop --disable geebeevv-mylar3.mylar3

      # Restore files
      if [ -f "$BACKUP_DIR/config.ini.$TIMESTAMP" ]; then
        cp "$BACKUP_DIR/config.ini.$TIMESTAMP" "$SNAP_COMMON/data/config.ini"
        echo "✓ Restored config.ini"
      fi

      if [ -f "$BACKUP_DIR/mylar.db.$TIMESTAMP" ]; then
        cp "$BACKUP_DIR/mylar.db.$TIMESTAMP" "$SNAP_COMMON/data/mylar.db"
        echo "✓ Restored mylar.db"
      fi

      # Restart service
      echo "Restarting Mylar3 service..."
      snapctl start --enable geebeevv-mylar3.mylar3

      echo ""
      echo "Restore complete!"
      EOF
      chmod +x $CRAFT_PART_INSTALL/bin/mylar3-restore

  install-hook:
    plugin: nil
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/snap/hooks
      cat > $CRAFT_PART_INSTALL/snap/hooks/install << 'EOF'
      #!/bin/bash
      # This hook runs on snap install
      # Sets up initial directories and configuration

      # Create persistent data directories
      mkdir -p "$SNAP_COMMON/data"
      mkdir -p "$SNAP_COMMON/logs"
      mkdir -p "$SNAP_COMMON/cache"
      mkdir -p "$SNAP_COMMON/comics"

      echo "Mylar3 installed successfully!"
      echo ""
      echo "Access Mylar3 at: http://localhost:8090"
      echo ""
      echo "=== Quick Start Commands ==="
      echo "  geebeevv-mylar3.status        - View service status and configuration"
      echo "  geebeevv-mylar3.logs          - View logs"
      echo "  geebeevv-mylar3.health-check  - Check if service is healthy"
      echo "  geebeevv-mylar3.backup        - Backup config and database"
      echo ""
      echo "=== Configuration ==="
      echo "Change settings without editing config files:"
      echo "  sudo snap set geebeevv-mylar3 port=8091"
      echo "  sudo snap set geebeevv-mylar3 verbose=true"
      echo "  sudo snap set geebeevv-mylar3 auto-backup=both"
      echo ""
      echo "=== File Access ==="
      echo "To access your comic library and download directories:"
      echo "  sudo snap connect geebeevv-mylar3:removable-media"
      echo ""
      echo "Data directory: $SNAP_COMMON/data"
      EOF
      chmod +x $CRAFT_PART_INSTALL/snap/hooks/install

  configure-hook:
    plugin: nil
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/snap/hooks
      cat > $CRAFT_PART_INSTALL/snap/hooks/configure << 'EOF'
      #!/bin/bash
      # This hook runs when configuration is changed via 'snap set'

      # Get configuration values
      PORT=$(snapctl get port 2>/dev/null)
      VERBOSE=$(snapctl get verbose 2>/dev/null)
      AUTO_BACKUP=$(snapctl get auto-backup 2>/dev/null)
      DISABLE_WEEKLY=$(snapctl get disable-weekly-check 2>/dev/null)

      # Validate port
      if [ -n "$PORT" ]; then
        if ! [[ "$PORT" =~ ^[0-9]+$ ]] || [ "$PORT" -lt 1024 ] || [ "$PORT" -gt 65535 ]; then
          echo "Error: Port must be a number between 1024 and 65535"
          exit 1
        fi
      fi

      # Validate verbose
      if [ -n "$VERBOSE" ]; then
        if [ "$VERBOSE" != "true" ] && [ "$VERBOSE" != "false" ]; then
          echo "Error: verbose must be 'true' or 'false'"
          exit 1
        fi
      fi

      # Validate auto-backup
      if [ -n "$AUTO_BACKUP" ]; then
        if [ "$AUTO_BACKUP" != "none" ] && [ "$AUTO_BACKUP" != "ini" ] && [ "$AUTO_BACKUP" != "db" ] && [ "$AUTO_BACKUP" != "both" ]; then
          echo "Error: auto-backup must be 'none', 'ini', 'db', or 'both'"
          exit 1
        fi
      fi

      # Validate disable-weekly-check
      if [ -n "$DISABLE_WEEKLY" ]; then
        if [ "$DISABLE_WEEKLY" != "true" ] && [ "$DISABLE_WEEKLY" != "false" ]; then
          echo "Error: disable-weekly-check must be 'true' or 'false'"
          exit 1
        fi
      fi

      # Restart the service to apply changes
      snapctl restart geebeevv-mylar3.mylar3

      echo "Configuration updated successfully!"
      echo ""
      echo "Current settings:"
      echo "  port: $(snapctl get port 2>/dev/null || echo '8090 (default)')"
      echo "  verbose: $(snapctl get verbose 2>/dev/null || echo 'false (default)')"
      echo "  auto-backup: $(snapctl get auto-backup 2>/dev/null || echo 'none (default)')"
      echo "  disable-weekly-check: $(snapctl get disable-weekly-check 2>/dev/null || echo 'false (default)')"
      echo ""
      echo "Service restarted. Access Mylar3 at: http://localhost:$(snapctl get port 2>/dev/null || echo '8090')"
      EOF
      chmod +x $CRAFT_PART_INSTALL/snap/hooks/configure

